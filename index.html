<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط السريع</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 { color: #1e293b; margin-bottom: 1.5rem; }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 1rem;
            font-size: 1rem;
            text-align: left;
            direction: ltr;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.3s;
        }

        button:hover { background-color: #1d4ed8; }

        .result-area {
            margin-top: 1.5rem;
            padding: 10px;
            border-radius: 8px;
            background: #f1f5f9;
            display: none;
        }

        .short-url {
            font-weight: bold;
            color: var(--primary-color);
            word-break: break-all;
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مختصر الروابط 🔗</h1>
    <input type="url" id="longUrl" placeholder="ضع الرابط الطويل هنا..." required>
    <button onclick="shortenUrl()">اختصار الرابط</button>

    <div id="resultArea" class="result-area">
        <p>الرابط المختصر:</p>
        <div id="shortUrl" class="short-url"></div>
        <button onclick="copyUrl()" style="margin-top:10px; background:#10b981;">نسخ الرابط</button>
    </div>

    <footer>
        ✨ تطوير: أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </footer>
</div>

<script>
    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultArea = document.getElementById('resultArea');
        const shortUrlDiv = document.getElementById('shortUrl');

        if (!longUrl) {
            alert("يرجى إدخال رابط صحيح");
            return;
        }

        try {
            // استخدام API مجاني لا يتطلب مفتاح تشفير لسهولة النشر على GitHub
            const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`);
            const data = await response.json();

            if (data.shorturl) {
                shortUrlDiv.innerText = data.shorturl;
                resultArea.style.display = 'block';
            } else {
                alert("حدث خطأ في اختصار الرابط، تأكد من صحة الرابط.");
            }
        } catch (error) {
            alert("فشل الاتصال بالخادم.");
        }
    }

    function copyUrl() {
        const text = document.getElementById('shortUrl').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert("تم نسخ الرابط بنجاح!");
        });
    }

    // كود الارتباط الشرطي لحماية الملكية الفكرية
    console.log("هذا الموقع محمي بحقوق الملكية الفكرية: أ/ عبدالعزيز الفيفي - ثانوية الأمير عبدالمجيد");
</script>

</body>
</html>
