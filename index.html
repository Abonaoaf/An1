<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختصر الروابط مع حفظ الـ QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --matte-red: #ba0000;
            --bg-color: #f8fafc;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 1rem;
            text-align: left;
            direction: ltr;
        }

        .btn {
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .btn-primary { background-color: var(--primary-color); }
        .btn-success { background-color: var(--success-color); }
        .btn-download { background-color: #4b5563; }

        .result-area {
            margin-top: 1.5rem;
            padding: 15px;
            border-radius: 8px;
            background: #f1f5f9;
            display: none;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .signature {
            margin-top: 2rem;
            color: var(--matte-red);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #1e293b;">مختصر الروابط والـ QR 🔗</h2>
    <input type="url" id="longUrl" placeholder="ضع الرابط هنا..." required>
    <button class="btn btn-primary" onclick="shortenUrl()">اختصار وتوليد QR</button>

    <div id="resultArea" class="result-area">
        <p>الرابط المختصر:</p>
        <div id="shortUrl" style="font-weight:bold; color:var(--primary-color); margin-bottom:15px; word-break: break-all;"></div>
        
        <div id="qrcode"></div>
        
        <button class="btn btn-success" onclick="copyUrl()">نسخ الرابط</button>
        <button class="btn btn-download" onclick="downloadQR()">حفظ صورة الـ QR</button>
    </div>

    <div class="signature">
        ✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓
    </div>
</div>

<script>
    let qrContainer = new QRCode(document.getElementById("qrcode"), {
        width: 180,
        height: 180
    });

    async function shortenUrl() {
        const longUrl = document.getElementById('longUrl').value;
        const resultArea = document.getElementById('resultArea');
        const shortUrlDiv = document.getElementById('shortUrl');

        if (!longUrl) {
            alert("يرجى إدخال رابط");
            return;
        }

        try {
            const response = await fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`);
            const data = await response.json();

            if (data.shorturl) {
                shortUrlDiv.innerText = data.shorturl;
                resultArea.style.display = 'block';
                
                qrContainer.clear();
                qrContainer.makeCode(data.shorturl);
            }
        } catch (error) {
            alert("حدث خطأ في الاتصال");
        }
    }

    function copyUrl() {
        const text = document.getElementById('shortUrl').innerText;
        navigator.clipboard.writeText(text).then(() => alert("تم النسخ بنجاح!"));
    }

    function downloadQR() {
        // العثور على صورة الـ QR الناتجة من المكتبة
        const img = document.querySelector('#qrcode img');
        if (img) {
            const link = document.createElement('a');
            link.href = img.src;
            link.download = 'QR_Code_AlFaifi.png'; // اسم الملف عند الحفظ
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        } else {
            // في بعض المتصفحات يتم إنشاء Canvas بدلاً من Img
            const canvas = document.querySelector('#qrcode canvas');
            const link = document.createElement('a');
            link.href = canvas.toDataURL("image/png");
            link.download = 'QR_Code_AlFaifi.png';
            link.click();
        }
    }

    console.log("الملكية الفكرية: أ/ عبدالعزيز الفيفي - ثانوية الأمير عبدالمجيد");
</script>

</body>
</html>
